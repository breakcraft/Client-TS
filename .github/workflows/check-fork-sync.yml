name: Check Fork Sync Status

on:
  push:
    branches:
      - '245.2'
  pull_request:
    branches:
      - '245.2'
  workflow_dispatch:

jobs:
  check-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: '245.2'
          fetch-depth: 0

      - name: Get repository info
        id: repo-info
        run: |
          # Get the repository full name (owner/repo)
          REPO_FULL_NAME="${GITHUB_REPOSITORY}"
          echo "repo_full_name=${REPO_FULL_NAME}" >> $GITHUB_OUTPUT

          # Use GitHub API to check if this is a fork and get parent info
          REPO_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${REPO_FULL_NAME}")

          IS_FORK=$(echo "$REPO_INFO" | jq -r '.fork')
          echo "is_fork=${IS_FORK}" >> $GITHUB_OUTPUT

          if [ "$IS_FORK" == "true" ]; then
            PARENT_FULL_NAME=$(echo "$REPO_INFO" | jq -r '.parent.full_name')
            PARENT_URL=$(echo "$REPO_INFO" | jq -r '.parent.clone_url')
            echo "parent_full_name=${PARENT_FULL_NAME}" >> $GITHUB_OUTPUT
            echo "parent_url=${PARENT_URL}" >> $GITHUB_OUTPUT
            echo "Repository is a fork of ${PARENT_FULL_NAME}"
          else
            echo "Repository is not a fork"
          fi

      - name: Check sync status
        if: steps.repo-info.outputs.is_fork == 'true'
        id: sync-check
        run: |
          # Add upstream remote
          git remote add upstream ${{ steps.repo-info.outputs.parent_url }}
          git fetch upstream

          # Check if upstream has branch 245.2
          if git ls-remote --heads upstream | grep -q "refs/heads/245.2"; then
            echo "Upstream has branch 245.2"

            # Get the current branch HEAD
            CURRENT_HEAD=$(git rev-parse HEAD)
            UPSTREAM_HEAD=$(git rev-parse upstream/245.2)

            # Try to merge upstream/245.2 into current branch (dry-run)
            # Create a temporary branch for testing
            git checkout -b temp-sync-check

            # Attempt merge
            if git merge --no-commit --no-ff upstream/245.2 2>&1 | tee merge_output.txt; then
              # Check if there are conflicts
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "result=conflicts" >> $GITHUB_OUTPUT
                echo "Merge would result in conflicts:"
                git diff --name-only --diff-filter=U
                git reset --hard HEAD
                exit 1
              else
                echo "result=success" >> $GITHUB_OUTPUT
                echo "Fork can sync without conflicts!"
                git reset --hard HEAD
                exit 0
              fi
            else
              # Merge command failed, likely due to conflicts
              echo "result=conflicts" >> $GITHUB_OUTPUT
              echo "Merge would result in conflicts:"
              cat merge_output.txt
              git reset --hard HEAD
              exit 1
            fi
          else
            echo "result=no-upstream-branch" >> $GITHUB_OUTPUT
            echo "Upstream does not have branch 245.2"
            exit 0
          fi

      - name: Report sync status
        if: always() && steps.repo-info.outputs.is_fork == 'true'
        run: |
          echo "## Fork Sync Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ steps.repo-info.outputs.repo_full_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Parent Repository:** ${{ steps.repo-info.outputs.parent_full_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Branch:** 245.2" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.sync-check.outputs.result }}" == "success" ]; then
            echo "✅ **Status:** Fork can sync without conflicts" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.sync-check.outputs.result }}" == "conflicts" ]; then
            echo "⚠️ **Status:** Fork has conflicts with upstream" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.sync-check.outputs.result }}" == "no-upstream-branch" ]; then
            echo "ℹ️ **Status:** Upstream does not have branch 245.2" >> $GITHUB_STEP_SUMMARY
          else
            echo "❓ **Status:** Unable to determine sync status" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Report non-fork status
        if: steps.repo-info.outputs.is_fork != 'true'
        run: |
          echo "## Fork Sync Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ steps.repo-info.outputs.repo_full_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ **Status:** This repository is not a fork. Sync check skipped." >> $GITHUB_STEP_SUMMARY
